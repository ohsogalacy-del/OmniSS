[package]
name = "omniss"
version = "1.0.0"
edition = "2021"
authors = ["OmniSS Security Research"]
description = "Industrial-grade Minecraft Screenshare & Memory Forensic Scanner"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
